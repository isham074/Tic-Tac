<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }
    .container {
      text-align: center;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 10px;
      margin: 20px auto;
    }
    .cell {
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid #fff;
      font-size: 2.5em;
      color: cyan;
      cursor: pointer;
      box-shadow: 0 0 15px #0ff;
      transition: background 0.3s;
    }
    .cell:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .neon-text {
      font-size: 2em;
      text-shadow: 0 0 10px #f0f, 0 0 20px #0ff, 0 0 30px #0ff;
    }
    .winner {
      color: #0f0;
      text-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
    }
    button, select {
      margin-top: 10px;
      padding: 10px 20px;
      background: #0ff;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px #0ff;
    }
    button:hover, select:hover {
      background: #0cc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="neon-text">Neon Tic Tac Toe</h1>
    <div id="status">Your turn (X)</div>
    <div class="board" id="board"></div>
    <button onclick="resetGame()">Restart Game</button>
    <div>
      <label for="difficulty">Difficulty:</label>
      <select id="difficulty" onchange="resetGame()">
        <option value="easy">Easy</option>
        <option value="smart" selected>Smart</option>
      </select>
    </div>
  </div>  <script>
    const board = document.getElementById('board');
    const status = document.getElementById('status');
    const difficultySelect = document.getElementById('difficulty');
    let currentPlayer = 'X';
    let gameActive = true;
    let cells = Array(9).fill(null);

    const winPatterns = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    function checkWinner() {
      for (let pattern of winPatterns) {
        const [a, b, c] = pattern;
        if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
          status.innerHTML = `<span class="winner">Player ${cells[a]} Wins!</span>`;
          gameActive = false;
          return;
        }
      }
      if (!cells.includes(null)) {
        status.innerHTML = '<span class="winner">Draw!</span>';
        gameActive = false;
      }
    }

    function botMove() {
      if (difficultySelect.value === 'easy') {
        const empty = cells.map((v, i) => v === null ? i : null).filter(v => v !== null);
        const move = empty[Math.floor(Math.random() * empty.length)];
        cells[move] = 'O';
      } else {
        for (let symbol of ['O', 'X']) {
          for (let pattern of winPatterns) {
            const [a, b, c] = pattern;
            const [valA, valB, valC] = [cells[a], cells[b], cells[c]];
            if ([valA, valB, valC].filter(v => v === symbol).length === 2 && [valA, valB, valC].includes(null)) {
              const emptyIndex = pattern.find(i => cells[i] === null);
              cells[emptyIndex] = 'O';
              render();
              checkWinner();
              currentPlayer = 'X';
              if (gameActive) status.textContent = `Your turn (X)`;
              return;
            }
          }
        }
        const empty = cells.map((v, i) => v === null ? i : null).filter(v => v !== null);
        if (empty.length > 0) {
          const move = empty[Math.floor(Math.random() * empty.length)];
          cells[move] = 'O';
        }
      }
      render();
      checkWinner();
      currentPlayer = 'X';
      if (gameActive) status.textContent = `Your turn (X)`;
    }

    function handleClick(index) {
      if (!gameActive || cells[index] || currentPlayer !== 'X') return;
      cells[index] = 'X';
      render();
      checkWinner();
      currentPlayer = 'O';
      if (gameActive) {
        status.textContent = `Bot's turn (O)`;
        setTimeout(botMove, 500);
      }
    }

    function render() {
      board.innerHTML = '';
      cells.forEach((cell, i) => {
        const div = document.createElement('div');
        div.classList.add('cell');
        div.textContent = cell;
        div.addEventListener('click', () => handleClick(i));
        board.appendChild(div);
      });
    }

    function resetGame() {
      cells = Array(9).fill(null);
      currentPlayer = 'X';
      gameActive = true;
      status.textContent = `Your turn (X)`;
      render();
    }

    render();
  </script></body>
</html>
